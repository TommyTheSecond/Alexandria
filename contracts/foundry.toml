[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["dependencies"]
solc = "0.8.24"
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200
fs_permissions = [
  { access = "read", path = "../fixtures" },
  { access = "read-write", path = "../deployments" },
]

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 256
depth = 128
fail_on_revert = false

[soldeer]
remappings_generate = false

[dependencies]
"@openzeppelin-contracts" = "5.1.0"
forge-std = "1.9.7"
